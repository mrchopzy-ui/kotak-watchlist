<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Asset Management | Watchlist v2</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>NEXUS <span class="subtitle">Asset Management</span></h1>
            <div class="status-indicator">● Live</div>
        </header>

        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search Symbol (e.g. RELIANCE)..." autocomplete="off">
            <div id="searchResults" class="dropdown"></div>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Symbol</th>
                        <th>Company Name</th>
                        <th>LTP</th>
                        <th>% Chg</th>
                        <th>Volume</th>
                        <th>OHLC</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="watchlistBody">
                    </tbody>
            </table>
        </div>
    </div>
    <script src="/static/app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>Nexus Asset Management</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<header class="header">
    <h1>Nexus Asset Management</h1>
</header>

<div class="tabs">
    {% for t in tabs %}
        <button class="tab {{ 'active' if t == active else '' }}"
                onclick="switchTab('{{ t }}')">
            {{ t }}
        </button>
    {% endfor %}
    <button class="tab add-tab" onclick="createTab()">＋</button>
</div>

<div class="search-box">
    <input id="search" placeholder="Search stock symbol (e.g. ITC)" autocomplete="off">
    <div id="suggestions"></div>
</div>

<table>
    <thead>
        <tr>
            <th onclick="sortBy('symbol')">Symbol</th>
            <th onclick="sortBy('company')">Company</th>
            <th onclick="sortBy('ltp')">LTP</th>
            <th onclick="sortBy('change_pct')">%</th>
            <th onclick="sortBy('open')">O</th>
            <th onclick="sortBy('high')">H</th>
            <th onclick="sortBy('low')">L</th>
            <th onclick="sortBy('close')">C</th>
            <th>Delete</th>
        </tr>
    </thead>
    <tbody id="watchlist"></tbody>
</table>

<script src="/static/app.js"></script>
</body>
</html>

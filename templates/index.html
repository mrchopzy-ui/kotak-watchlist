<!DOCTYPE html>
<html>
<head>
    <title>Nexus Asset Management</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<header class="header">
    <h1>Nexus Asset Management</h1>
</header>

<div class="tabs">
    {% for t in tabs %}
        <button class="tab {{ 'active' if t == active else '' }}" onclick="switchTab('{{ t }}')">{{ t }}</button>
    {% endfor %}
    <button class="tab" onclick="createTab()">＋</button>
</div>

<div class="search-box">
    <input id="search" placeholder="Search stock symbol">
    <div id="suggestions"></div>
</div>

<table>
    <thead>
        <tr>
            <th>Symbol</th>
            <th>Company</th>
            <th>Supertrend (15min)</th>
            <th>Delete</th>
        </tr>
    </thead>
    <tbody id="watchlist"></tbody>
</table>

<script src="/static/app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <title>Nexus Asset Management</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<header>
  <h1>Nexus Asset Management</h1>
</header>

<div class="controls">
  <input id="search" placeholder="Type stock symbol..." autocomplete="off">
  <div id="suggestions"></div>
</div>

<div class="tabs">
  {% for w in watchlists %}
    <button onclick="loadWatchlist({{w.id}})">{{w.name}}</button>
  {% endfor %}
</div>

<table>
  <thead>
    <tr>
      <th>Symbol</th>
      <th>Company</th>
      <th>Price</th>
      <th>%</th>
      <th>Volume</th>
      <th>Open</th>
      <th>High</th>
      <th>Low</th>
      <th>Close</th>
      <th>Delete</th>
    </tr>
  </thead>
  <tbody id="rows"></tbody>
</table>

<script src="/static/app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>Nexus Asset Management</title>
    <meta charset="utf-8">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            padding: 20px;
        }

        h1 {
            margin-bottom: 15px;
        }

        .search-row {
            display: flex;
            gap: 10px;
            width: 520px;
            position: relative;
        }

        #search {
            flex: 1;
            padding: 10px;
            font-size: 16px;
        }

        #addBtn {
            padding: 10px 16px;
            font-size: 16px;
            cursor: pointer;
        }

        .suggestions {
            position: absolute;
            top: 45px;
            left: 0;
            right: 0;
            background: white;
            border: 1px solid #ccc;
            z-index: 1000;
        }

        .suggestions div {
            padding: 8px;
            cursor: pointer;
        }

        .suggestions div:hover {
            background: #e6f0ff;
        }

        table {
            width: 100%;
            margin-top: 20px;
            border-collapse: collapse;
            background: white;
        }

        th, td {
            padding: 10px;
            border-bottom: 1px solid #ddd;
            text-align: center;
        }

        th {
            background: #f0f0f0;
        }

        .delete {
            color: red;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>

<body>

<h1>Nexus Asset Management</h1>

<div class="search-row">
    <input id="search" placeholder="Type stock symbol or name (e.g. RAIN, ITC)" autocomplete="off">
    <button id="addBtn">Add</button>
    <div id="suggestions" class="suggestions"></div>
</div>

<table>
    <thead>
        <tr>
            <th>Symbol</th>
            <th>Company Name</th>
            <th>LTP</th>
            <th>% Change</th>
            <th>Open</th>
            <th>High</th>
            <th>Low</th>
            <th>Close</th>
            <th>Volume</th>
            <th>Delete</th>
        </tr>
    </thead>
    <tbody id="watchlist"></tbody>
</table>

<script>
let selectedStock = null;

// 🔍 SEARCH
$("#search").on("input", function () {
    const q = $(this).val();
    $("#suggestions").empty();
    selectedStock = null;

    if (q.length < 1) return;

    $.get("/search?q=" + q, function (data) {
        data.forEach(s => {
            const row = $("<div>")
                .text(s.trading_symbol + " — " + s.company_name)
                .click(() => {
                    selectedStock = s;
                    $("#search").val(s.trading_symbol);
                    $("#suggestions").empty();
                });
            $("#suggestions").append(row);
        });
    });
});

// ➕ ADD
$("#addBtn").click(function () {
    if (!selectedStock) {
        alert("Please select a stock from suggestions");
        return;
    }

    $.ajax({
        url: "/add",
        method: "POST",
        contentType: "application/json",
        data: JSON.stringify(selectedStock),
        success: () => {
            selectedStock = null;
            $("#search").val("");
            $("#suggestions").empty();
            loadPrices();
        }
    });
});

// ❌ REMOVE
function removeStock(key) {
    $.ajax({
        url: "/remove",
        method: "POST",
        contentType: "application/json",
        data: JSON.stringify({ symbol: key }),
        success: loadPrices
    });
}

// 📈 LOAD PRICES
function loadPrices() {
    $.get("/prices", function (data) {
        const tbody = $("#watchlist");
        tbody.empty();

        data.forEach(s => {
            const key = s.exchange + "|" + s.exchange_token;
            tbody.append(`
                <tr>
                    <td>${s.trading_symbol}</td>
                    <td>${s.company_name}</td>
                    <td>${s.ltp.toFixed(2)}</td>
                    <td>${s.per_change.toFixed(2)}%</td>
                    <td>${s.ohlc.open.toFixed(2)}</td>
                    <td>${s.ohlc.high.toFixed(2)}</td>
                    <td>${s.ohlc.low.toFixed(2)}</td>
                    <td>${s.ohlc.close.toFixed(2)}</td>
                    <td>${formatVolume(s.last_volume)}</td>
                    <td class="delete" onclick="removeStock('${key}')">✖</td>
                </tr>
            `);
        });
    });
}

function formatVolume(v) {
    if (v >= 1e9) return (v / 1e9).toFixed(2) + "B";
    if (v >= 1e6) return (v / 1e6).toFixed(2) + "M";
    if (v >= 1e3) return (v / 1e3).toFixed(2) + "K";
    return v;
}

loadPrices();
setInterval(loadPrices, 5000);
</script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>Nexus Asset Management</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<h1>Nexus Asset Management</h1>

<div class="tabs">
    {% for t in tabs %}
        <button class="tab {{ 'active' if t == active else '' }}"
                onclick="switchTab('{{ t }}')">
            {{ t }}
        </button>
    {% endfor %}
    <button onclick="createTab()">＋</button>
</div>

<div class="search-box">
    <input id="search" placeholder="Type stock symbol">
    <button id="addBtn" disabled>Add</button>
    <div id="suggestions"></div>
</div>

<table>
    <thead>
        <tr>
            <th>Symbol</th>
            <th>Company</th>
            <th>LTP</th>
            <th>%</th>
            <th>O</th>
            <th>H</th>
            <th>L</th>
            <th>C</th>
            <th>Delete</th>
        </tr>
    </thead>
    <tbody id="watchlist"></tbody>
</table>

<script src="/static/app.js"></script>
</body>
</html>

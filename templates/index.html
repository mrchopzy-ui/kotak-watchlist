<!DOCTYPE html>
<html>
<head>
    <title>Nexus Asset Management</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<header class="header">
    <h1>Nexus Asset Management</h1>
</header>

<div class="tabs">
    {% for t in tabs %}
        <button class="tab {{ 'active' if t == active else '' }}"
                ondblclick="editTab(this, '{{ t }}')"
                onclick="switchTab('{{ t }}')">
            {{ t }}
        </button>
    {% endfor %}
    <button class="tab add-tab" onclick="createTab()">＋</button>
</div>

<div class="search-box">
    <input id="search" placeholder="Type stock symbol (ITC)" autocomplete="off">
    <div id="suggestions"></div>
</div>

<table>
    <thead>
        <tr>
            <th onclick="sortBy('symbol')">Symbol</th>
            <th onclick="sortBy('company')">Company</th>
            <th onclick="sortBy('ltp')">LTP</th>
            <th onclick="sortBy('change_pct')">%</th>
            <th>O</th><th>H</th><th>L</th><th>C</th>
            <th>Delete</th>
        </tr>
    </thead>
    <tbody id="watchlist"></tbody>
</table>

<script src="/static/app.js"></script>
</body>
</html>

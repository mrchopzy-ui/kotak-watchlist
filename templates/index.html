<!DOCTYPE html>
<html>
<head>
  <title>Nexus Asset Management</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<header>
  <h1>Nexus Asset Management</h1>
  <input id="search" placeholder="Add stock..." autocomplete="off">
  <div id="suggestions"></div>
</header>

<div class="tabs">
  {% for w in watchlists %}
    <button onclick="load({{w[0]}})">{{w[1]}}</button>
  {% endfor %}
</div>

<table>
<thead>
<tr>
  <th>Symbol</th>
  <th>Company Name</th>
  <th>Price</th>
  <th>%</th>
</tr>
</thead>
<tbody id="rows"></tbody>
</table>

<script src="/static/app.js"></script>
</body>
</html>

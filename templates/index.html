<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Asset Management | Stock Watchlist</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header>
        <div class="header-left">
            <h1>NEXUS ASSET MANAGEMENT</h1>
        </div>
        <div id="indices-bar" class="indices-container">
            <!-- Indices loaded via JS -->
        </div>
    </header>

    <main>
        <div class="search-container">
            <input type="text" id="stock-search" placeholder="Search Stock (e.g. RELIANCE)..." autocomplete="off">
            <div id="search-results" class="autocomplete-items"></div>
        </div>

        <div class="watchlist-tabs-container">
            <div id="watchlist-tabs" class="tabs"></div>
            <button id="add-watchlist-btn" class="btn-add">+</button>
        </div>

        <div class="table-wrapper">
            <table id="stock-table">
                <thead>
                    <tr>
                        <th onclick="sortTable(0)">Symbol ↕</th>
                        <th onclick="sortTable(1)">Company ↕</th>
                        <th onclick="sortTable(2)">LTP ↕</th>
                        <th onclick="sortTable(3)">% Change ↕</th>
                        <th onclick="sortTable(4)">Volume ↕</th>
                        <th onclick="sortTable(5)">Open ↕</th>
                        <th onclick="sortTable(6)">High ↕</th>
                        <th onclick="sortTable(7)">Low ↕</th>
                        <th onclick="sortTable(8)">Close ↕</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="stock-list-body">
                    <!-- Stocks load here -->
                </tbody>
            </table>
        </div>
    </main>

    <script src="/static/app.js"></script>
</body>
</html>

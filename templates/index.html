<!DOCTYPE html>
<html>
<head>
    <title>Nexus Asset Management</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<header>
    <h1>Nexus Asset Management</h1>
    <button id="newWL">+ Watchlist</button>
</header>

<div class="tabs">
{% for w in watchlists %}
    <div class="tab" data-id="{{w[0]}}" data-type="{{w[2]}}">{{w[1]}}</div>
{% endfor %}
</div>

<input id="search" placeholder="Type symbol…" autocomplete="off">
<div id="suggestions"></div>

<table>
<thead>
<tr>
<th>Symbol</th>
<th>Company Name</th>
<th>Price</th>
<th>%</th>
<th>Volume</th>
<th>O</th><th>H</th><th>L</th><th>C</th>
<th>Del</th>
</tr>
</thead>
<tbody id="rows"></tbody>
</table>

<script src="/static/app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>Nexus Asset Management</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<h1>Nexus Asset Management</h1>

<div id="tabs">
    {% for w in watchlists %}
    <div class="tab" data-id="{{w[0]}}">{{w[1]}}</div>
    {% endfor %}
    <button id="addWatchlist">+</button>
</div>

<input id="search" placeholder="Type stock symbol">
<div id="suggestions"></div>

<table>
<thead>
<tr>
<th>Symbol</th>
<th>Company Name</th>
<th>LTP</th>
<th>%</th>
<th>Volume</th>
<th>Open</th>
<th>High</th>
<th>Low</th>
<th>Close</th>
<th></th>
</tr>
</thead>
<tbody id="watchlist"></tbody>
</table>

<script src="/static/app.js"></script>
</body>
</html>

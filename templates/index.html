<!DOCTYPE html>
<html>
<head>
    <title>Nexus Asset Management</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<header>
    <h1>Nexus Asset Management</h1>
    <input id="search" placeholder="Search EQ / Futures / Options">
    <div id="suggestions"></div>
</header>

<div class="tabs">
    {% for t in tabs %}
    <div class="tab" data-id="{{t[0]}}">{{t[1]}}</div>
    {% endfor %}
    <button id="addWatchlist">＋</button>
</div>

<table>
<thead>
<tr>
<th>Symbol</th>
<th>Company Name</th>
<th>Price</th>
<th>%</th>
<th>Delete</th>
</tr>
</thead>
<tbody id="watchlist"></tbody>
</table>

<script src="/static/app.js"></script>
</body>
</html>

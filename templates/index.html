<!DOCTYPE html>
<html>
<head>
    <title>Nexus Asset Management</title>
    <meta charset="utf-8">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 20px;
        }

        h1 {
            margin-bottom: 10px;
        }

        .search-box {
            width: 300nexuspx;
            padding: 10px;
            font-size: 16px;
        }

        .suggestions {
            background: white;
            border: 1px solid #ccc;
            max-width: 400px;
            position: absolute;
            z-index: 10;
        }

        .suggestions div {
            padding: 8px;
            cursor: pointer;
        }

        .suggestions div:hover {
            background: #e6f0ff;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background: white;
        }

        th, td {
            padding: 10px;
            border-bottom: 1px solid #ddd;
            text-align: center;
        }

        th {
            background: #f0f0f0;
        }

        .delete-btn {
            color: red;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>

<body>

<h1>Nexus Asset Management</h1>

<input id="search" class="search-box" placeholder="Type stock symbol..." autocomplete="off">
<div id="suggestions" class="suggestions"></div>

<table>
    <thead>
        <tr>
            <th>Symbol</th>
            <th>Company</th>
            <th>LTP</th>
            <th>% Change</th>
            <th>Open</th>
            <th>High</th>
            <th>Low</th>
            <th>Close</th>
            <th>Volume</th>
            <th>Delete</th>
        </tr>
    </thead>
    <tbody id="watchlist"></tbody>
</table>

<script>
let selectedStock = null;

// 🔍 SEARCH SUGGESTIONS
$("#search").on("input", function () {
    let q = $(this).val();
    if (q.length < 2) {
        $("#suggestions").empty();
        return;
    }

    $.get("/search?q=" + q, function (data) {
        $("#suggestions").empty();
        data.forEach(s => {
            let div = $("<div>").text(s.trading_symbol);
            div.click(() => {
                selectedStock = s;
                $("#search").val(s.trading_symbol);
                $("#suggestions").empty();
                addStock();
            });
            $("#suggestions").append(div);
        });
    });
});

// ➕ ADD STOCK
function addStock() {
    if (!selectedStock) return;

    $.ajax({
        url: "/add",
        method: "POST",
        contentType: "application/json",
        data: JSON.stringify(selectedStock),
        success: () => {
            selectedStock = null;
            $("#search").val("");
            loadPrices();
        }
    });
}

// ❌ REMOVE STOCK
function removeStock(key) {
    $.ajax({
        url: "/remove",
        method: "POST",
        contentType: "application/json",
        data: JSON.stringify({ symbol: key }),
        success: loadPrices
    });
}

// 📈 LOAD PRICES
function loadPrices() {
    $.get("/prices", function (data) {
        let tbody = $("#watchlist");
        tbody.empty();

        data.forEach(s => {
            let key = s.exchange + "|" + s.exchange_token;
            tbody.append(`
                <tr>
                    <td>${s.trading_symbol}</td>
                    <td>${s.company_name}</td>
                    <td>${s.ltp.toFixed(2)}</td>
                    <td>${s.per_change.toFixed(2)}%</td>
                    <td>${s.ohlc.open.toFixed(2)}</td>
                    <td>${s.ohlc.high.toFixed(2)}</td>
                    <td>${s.ohlc.low.toFixed(2)}</td>
                    <td>${s.ohlc.close.toFixed(2)}</td>
                    <td>${formatVolume(s.last_volume)}</td>
                    <td class="delete-btn" onclick="removeStock('${key}')">✖</td>
                </tr>
            `);
        });
    });
}

// 📊 VOLUME FORMAT
function formatVolume(v) {
    if (v >= 1e9) return (v / 1e9).toFixed(2) + "B";
    if (v >= 1e6) return (v / 1e6).toFixed(2) + "M";
    if (v >= 1e3) return (v / 1e3).toFixed(2) + "K";
    return v;
}

loadPrices();
setInterval(loadPrices, 5000);
</script>

</body>
</html>

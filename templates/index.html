<!DOCTYPE html>
<html>
<head>
  <title>Nexus Asset Management</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<header>
  <h1>Nexus Asset Management</h1>
  <button id="addWL">＋ Watchlist</button>
</header>

<div id="tabs">
  {% for w in watchlists %}
    <div class="tab" data-id="{{w[0]}}">{{w[1]}}</div>
  {% endfor %}
</div>

<input id="search" placeholder="Search Equity / F&O">
<div id="suggestions"></div>

<table>
<thead>
<tr>
  <th>Symbol</th>
  <th>Company Name</th>
  <th>Price</th>
  <th>%</th>
  <th>Delete</th>
</tr>
</thead>
<tbody id="rows"></tbody>
</table>

<script src="/static/app.js"></script>
</body>
</html>
